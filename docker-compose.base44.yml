services:
  web:
    image: ruby:3.2-slim
    working_dir: /app
    volumes:
      - ./:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=1
    command:
      - sh
      - -ec
      - |
        apt-get update && apt-get install -y --no-install-recommends build-essential curl
        bundle install
        exec bundle exec jekyll serve \
          --host 0.0.0.0 \
          --port 3000 \
          --livereload \
          --force_polling \
          --baseurl ''
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: on-failure

volumes:
  bundle_cache:
