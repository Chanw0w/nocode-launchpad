# Site Settings
title: "NoCode Launchpad"
description: "Build faster without code. Expert reviews, tutorials, and deals for Base44, Wix, and more."
url: "https://chanw0w.github.io"
baseurl: "/nocode-launchpad"
author: "Chanw0w"
email: "chantellevanheer@gmail.com"

# Social
github_username: Chanw0w
twitter_username: ""
linkedin_username: ""

# Build Settings
markdown: kramdown
permalink: /:title/
paginate: 10
paginate_path: "/page/:num/"

# SEO
google_analytics: ""
google_search_console: ""

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Collections
collections:
  tutorials:
    output: true
    permalink: /tutorials/:title/
  reviews:
    output: true
    permalink: /reviews/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Chanw0w"
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "tutorial"
  - scope:
      path: ""
      type: "reviews"
    values:
      layout: "review"

# Exclude from build
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - RESPONSIVE-DESIGN.md
  - CAMPAIGN-CALENDAR.md
  - week1-content.md
  - week2-content.md
  - week3-content.md
  - week4-content.md
  - generate-pdfs.js
  - .eslintrc.json
  - .prettierrc
  - .stylelintrc.json
  - jest.config.js
  - tests
