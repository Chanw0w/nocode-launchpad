# Site Settings
title: "NoCode Launchpad"
description: "Build faster without code. Expert reviews, tutorials, and deals for Base44, Wix, and more."
url: "https://chanw0w.github.io"
baseurl: "/nocode-launchpad"
author: "Chanw0w"
email: "chantellevanheer@gmail.com"

# Social
github_username: Chanw0w

# Build Settings
markdown: kramdown
permalink: /:title/
paginate: 10
paginate_path: "/page/:num/"
future: true

# SEO
google_analytics: ""
google_search_console: ""

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Sitemap exclusions
sitemap:
  exclude:
    - googled854e46cdcd3121f.html
    - _s8SqVs-JbWm9h2E7R0XCP097Cmuw1EqazqgCdZFASk.html
    - premium.html
    - analytics-setup.html
    - social-ads/preview.html

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Chanw0w"

# Exclude from build
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - RESPONSIVE-DESIGN.md
  - CAMPAIGN-CALENDAR.md
  - week1-content.md
  - week2-content.md
  - week3-content.md
  - week4-content.md
  - generate-pdfs.js
  - .eslintrc.json
  - .prettierrc
  - .stylelintrc.json
  - jest.config.js
  - tests