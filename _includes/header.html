<header class="site-header" id="site-header">
  <nav class="nav-container">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <span class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 0L20 5V15L10 20L0 15V5L10 0Z" fill="#FAFAC6"/>
        </svg>
      </span>
      <span>NoCode Launchpad</span>
    </a>
    
    <div class="nav-links">
      <a href="{{ '/' | relative_url }}" class="nav-link active">Home</a>
      <a href="{{ '/tutorials' | relative_url }}" class="nav-link">Tutorials</a>
      <a href="{{ '/reviews' | relative_url }}" class="nav-link">Reviews</a>
      <a href="{{ '/tools' | relative_url }}" class="nav-link">Tools</a>
      <a href="{{ '/blog' | relative_url }}" class="nav-link">Blog</a>
    </div>
    
    <div class="nav-actions">
      <a href="#newsletter" class="btn btn-primary btn-sm">
        Get Free Guide
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" class="btn-icon">
          <path d="M5 10L9 7L5 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      
      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span class="hamburger"></span>
      </button>
    </div>
  </nav>
  
  <div class="mobile-menu" id="mobile-menu">
    <div class="mobile-menu-content">
      <a href="{{ '/' | relative_url }}" class="mobile-nav-link active">Home</a>
      <a href="{{ '/tutorials' | relative_url }}" class="mobile-nav-link">Tutorials</a>
      <a href="{{ '/reviews' | relative_url }}" class="mobile-nav-link">Reviews</a>
      <a href="{{ '/tools' | relative_url }}" class="mobile-nav-link">Tools</a>
      <a href="{{ '/blog' | relative_url }}" class="mobile-nav-link">Blog</a>
      <a href="#newsletter" class="btn btn-primary btn-block">Get Free Guide</a>
    </div>
  </div>
</header>

<script>
  const menuToggle = document.getElementById('mobile-menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  
  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
      menuToggle.setAttribute('aria-expanded', 
        menuToggle.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'
      );
    });
  }
</script>
